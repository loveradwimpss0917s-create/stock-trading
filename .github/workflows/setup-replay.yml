name: setup-replay
on:
  workflow_dispatch:
    inputs:
      every:
        description: "Replay every Nth session (5 = weekly)"
        default: "5"
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r pipeline_py/requirements.txt
      - name: Replay Setup rules over history
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >
          python -m pipeline_py.setups.replay
          --every ${{ github.event.inputs.every || '5' }}
          --persist
