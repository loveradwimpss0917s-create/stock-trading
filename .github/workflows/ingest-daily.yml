name: ingest-daily
on:
  schedule:
    - cron: "30 9 * * 1-5"   # UTC 09:30 = JST 18:30（営業日）
  workflow_dispatch:
    inputs:
      mode:
        description: "backfill (~2y) or incremental (7d)"
        type: choice
        options: [incremental, backfill]
        default: incremental
      limit:
        description: "Limit securities count (leave empty for all)"
        required: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r pipeline_py/requirements.txt
      - name: Fetch J-Quants
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >
          python -m pipeline_py.ingest.run
          --mode ${{ github.event.inputs.mode || 'incremental' }}
          ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }}
