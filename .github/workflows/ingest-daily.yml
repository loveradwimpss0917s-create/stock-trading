name: ingest-daily
on:
  schedule:
    - cron: "30 9 * * 1-5"   # UTC 09:30 = JST 18:30（営業日）
  workflow_dispatch:
    inputs:
      mode:
        description: "backfill (full plan window) or incremental (7d)"
        type: choice
        options: [incremental, backfill]
        default: incremental
      universe:
        description: "Codes to cover (core30 ≈ 15min, topix500 spans several runs)"
        type: choice
        options: [core30, large100, topix500, operating, all]
        default: core30
      max_minutes:
        description: "Stop starting new codes after this many minutes"
        default: "300"
      limit:
        description: "Extra cap on codes this run (blank = no cap)"
        required: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    # Above the 300-minute default budget so the job isn't killed mid-code;
    # GitHub's own ceiling is 360.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r pipeline_py/requirements.txt
      - name: Fetch J-Quants
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >
          python -m pipeline_py.ingest.run
          --mode ${{ github.event.inputs.mode || 'incremental' }}
          --universe ${{ github.event.inputs.universe || 'core30' }}
          --max-minutes ${{ github.event.inputs.max_minutes || '300' }}
          ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }}
